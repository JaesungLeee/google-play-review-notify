name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 2 * * 1' # weekly, Monday 02:30 UTC

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          # The committed Action bundle and test fixtures are generated or third-party content.
          config: |
            paths-ignore:
              - dist
              - test/fixtures
              - node_modules
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
