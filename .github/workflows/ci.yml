name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Built CLI reports the package version
        run: |
          expected=$(node -p "require('./package.json').version")
          actual=$(node dist/cli.js --version)
          test "$actual" = "$expected" || { echo "::error::dist/cli.js --version is $actual, expected $expected"; exit 1; }
      - name: Ensure committed action bundle is up to date
        if: matrix.node == 20
        run: |
          git diff --exit-code -- dist/action/index.js || {
            echo "::error::dist/action/index.js is stale. Run 'npm run build' and commit the result."
            exit 1
          }
