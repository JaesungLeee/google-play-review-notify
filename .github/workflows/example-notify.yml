# Example consumer workflow (copy into your app repository and enable the schedule).
# In this repository it doubles as a smoke test of the published `v1` Action through the reusable
# workflow: run it from the Actions tab. Without a config file the `packages` input builds one, no
# source is enabled, and the run only records a baseline in the Actions cache.
name: Play review notify (example)

on:
  workflow_dispatch:
    inputs:
      packages:
        description: Comma-separated package names (used because this repo has no config file)
        type: string
        default: com.example.app
      dry-run:
        description: Render without sending or saving state
        type: boolean
        default: true
  # schedule:
  #   - cron: '*/10 * * * *'

jobs:
  notify:
    # Required: a called workflow cannot request more than the caller grants, and the default
    # GITHUB_TOKEN permissions of a repository are usually read-only.
    permissions:
      contents: read
      actions: write # state lives in the Actions cache
    uses: JaesungLeee/google-play-review-notify/.github/workflows/notify.yml@v1
    with:
      config-path: play-review-notify.yml
      packages: ${{ inputs.packages }}
      dry-run: ${{ inputs.dry-run }}
    secrets:
      GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
      GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
      GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
