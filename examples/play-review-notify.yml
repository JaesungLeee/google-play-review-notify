# yaml-language-server: $schema=https://raw.githubusercontent.com/JaesungLeee/google-play-review-notify/main/schemas/config.schema.json
# Example configuration. Copy to your repository root as play-review-notify.yml.
# Secrets are injected via ${ENV_VAR} references; never commit real values.
version: 1

apps:
  - packageName: com.example.app
    name: 'Example App'
    tracks: [production]
    channels: [release-slack]

sources:
  email:
    # POLICY_WARNING, and the reason text for REJECTED, from Play Console emails. See docs/gmail-oauth.md.
    enabled: true
    auth:
      clientId: ${GMAIL_CLIENT_ID}
      clientSecret: ${GMAIL_CLIENT_SECRET}
      refreshToken: ${GMAIL_REFRESH_TOKEN}
    lookbackHours: 24
  playApi:
    # PENDING_SUBMISSION, SUBMITTED, APPROVED, REJECTED and LIVE from the release lifecycle of
    # each configured track. See docs/play-api-setup.md.
    enabled: true
    serviceAccountJson: ${PLAY_SERVICE_ACCOUNT_JSON}

events:
  REJECTED: { enabled: true, mentions: ['<!channel>'] }
  # LIVE: { enabled: true, mergeInto: APPROVED }   # one message per release instead of approved + live
  # SUBMITTED: { enabled: true }                    # off by default
  # PENDING_SUBMISSION: { enabled: true }           # off by default

channels:
  release-slack:
    type: slack
    webhookUrl: ${SLACK_WEBHOOK_URL}
  # ops-discord:
  #   type: discord
  #   webhookUrl: ${DISCORD_WEBHOOK_URL}
  # n8n:
  #   type: webhook
  #   url: ${N8N_WEBHOOK_URL}
  #   secret: ${N8N_WEBHOOK_SECRET}
defaultChannels: [release-slack]

# language: ko # en | ko: language of the built-in notification text

stateStore:
  type: file
  path: .play-review-notify/state.json
