version: 1

apps:
  - packageName: com.mino.gguk
    name: '끅'
    tracks: [production]

sources:
  email:
    enabled: true
    auth:
      clientId: ${GMAIL_CLIENT_ID}
      clientSecret: ${GMAIL_CLIENT_SECRET}
      refreshToken: ${GMAIL_REFRESH_TOKEN}
    lookbackHours: 240    # 첫 테스트용: 8월 31일 찰나 거절 메일까지 잡히도록 10일
  playApi:
    enabled: false
  storeListing:
    enabled: true
    locale: ko
    country: KR

events:
  REJECTED: { enabled: true }
  POLICY_WARNING: { enabled: true }
  LIVE: { enabled: true }

channels:
  release-slack:
    type: slack
    webhookUrl: ${SLACK_WEBHOOK_URL}
defaultChannels: [release-slack]

stateStore:
  type: file
  path: .play-review-notify/state.json
